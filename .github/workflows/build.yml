name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: "no-filter"

      - name: Debug
        run: |
          ls -la
          ls -la MacPinginfo.xcodeproj/

      - name: Build
        run: xcodebuild -scheme MacPinginfo -configuration Release build -derivedDataPath DerivedData

      - name: Package
        run: |
          cd DerivedData/Build/Products/Release
          zip -r MacPinginfo.zip MacPinginfo.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DerivedData/Build/Products/Release/MacPinginfo.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
