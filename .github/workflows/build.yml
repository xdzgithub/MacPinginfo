name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: "blob:none"
          sparse-checkout: |
            .github
            MacPinginfo.xcodeproj

      - name: Build
        run: xcodebuild -scheme MacPinginfo -configuration Release build -derivedDataPath DerivedData

      - name: Package
        run: |
          cd DerivedData/Build/Products/Release
          zip -r MacPinginfo.zip MacPinginfo.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DerivedData/Build/Products/Release/MacPinginfo.zip
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
